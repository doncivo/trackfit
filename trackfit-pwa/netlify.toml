# ══════════════════════════════════════════════════════
# TrackFit — Configuration Netlify
# ══════════════════════════════════════════════════════

[build]
  base    = "trackfit-pwa"
  publish = "trackfit-pwa"

# ── Headers HTTP ──────────────────────────────────────

# Icônes : cache 1 an (immuables)
[[headers]]
  for = "/icon-*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manifest : cache 1 heure
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/manifest+json"

# Service Worker : jamais mis en cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Page principale : toujours revalidée
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sécurité sur tout le site
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
